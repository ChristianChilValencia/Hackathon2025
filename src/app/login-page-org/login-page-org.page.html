<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>AgriVenture</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="custom-content" [fullscreen]="true">
  <div class="hero-image">
    <img src="assets/Farmer-pic.jpg" alt="Farmer background">
  </div>
  
  <div class="logo-container">
    <h1 class="logo-text">
      <span class="agri">Agri</span><span class="venture">Venture</span>
    </h1>
    <p class="tagline">Where Farmers Meet the Future of Buying</p>
  </div>

  <div class="form-container">
    <ion-item class="custom-input">
      <ion-input type="email" placeholder="Email" label="Email" label-placement="floating"></ion-input>
    </ion-item>
    
    <ion-item class="custom-input">
      <ion-input type="password" placeholder="Password" label="Password" label-placement="floating"></ion-input>
      <ion-icon name="eye-outline" slot="end"></ion-icon>
    </ion-item>
    
    <div class="remember-forgot">
      <ion-checkbox labelPlacement="end">Remember Me</ion-checkbox>
      <a href="#">Forgot Password?</a>
    </div>
    
    <ion-button expand="block" class="primary-button" (click)="signIn()">
      Sign in with Account
    </ion-button>
    
    <div class="divider">
      <span>Or continue with</span>
    </div>
    
    <div class="social-buttons">
      <ion-button class="social-circle-button facebook-button">
        <ion-icon name="logo-facebook"></ion-icon>
      </ion-button>
      
      <ion-button class="social-circle-button google-button">
        <ion-icon name="logo-google"></ion-icon>
      </ion-button>
      
      <ion-button class="social-circle-button apple-button">
        <ion-icon name="logo-apple"></ion-icon>
      </ion-button>
    </div>
    
    <div class="signup-text">
      Don't have an account? <a routerLink="/profile-organization">Sign up</a>
    </div>
  </div>
</ion-content>
