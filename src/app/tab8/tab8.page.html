<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Profile</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/tabs/tab1">
        <ion-icon name="people"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="profile-content">
  <div class="profile-header">
    <div class="profile-image-container">
      <img src="assets/pedro.png" alt="Profile Photo" class="profile-image">
    </div>
    <h2 class="profile-name">Pedro Penduko</h2>
    <p class="profile-email">pedro.penduko&#64;gmail.com</p>
  </div>

  <div class="profile-details">
    
    <ion-item>
      <ion-label position="stacked">First Name</ion-label>
      <ion-input value="Pedro" readonly></ion-input>
    </ion-item>
      
    <ion-item>
      <ion-label position="stacked">Last Name</ion-label>
      <ion-input value="Penduko" readonly></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Home Address</ion-label>
      <ion-input value="746 Banilad, Cebu City" readonly></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Cellphone Number</ion-label>
      <div class="phone-input">
        <div class="flag-container">
            <ion-icon name="call" class="flag-icon"></ion-icon>
        </div>
        <ion-input value="+097604563211" readonly></ion-input>
      </div>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Gender</ion-label>
      <ion-input value="Male" readonly></ion-input>
      <ion-icon name="chevron-down-outline" slot="end"></ion-icon>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Email</ion-label>
      <ion-input value="pedro.penduko@gmail.com" readonly></ion-input>
    </ion-item>
  </div>
</ion-content>
