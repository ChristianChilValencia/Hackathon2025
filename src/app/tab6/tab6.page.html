<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Customer Shop
    </ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/tabs/tab1">
        <ion-icon name="people"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
  <ion-searchbar placeholder="Search products" (ionInput)="onSearch($event)" style="flex-grow: 1; margin-right: 8px;">
  </ion-searchbar>
  <ion-button fill="clear" size="small">
    <ion-icon name="filter" slot="icon-only"></ion-icon>
  </ion-button>
</div>
  <div class="ion-padding">
    <ion-row>
      <ion-col size="6" *ngFor="let product of filteredProducts">
        <ion-card  style="height: 100%; display: flex; flex-direction: column; justify-content: space-between;">
          <ion-card-content>
            <ion-button expand="block" size="small" (click)="showCustomerActionSheet(product)" color="medium">
              More Options
            </ion-button>
            <ion-card-header>{{ product.name }}
              <span>₱{{ product.price }}/KG</span>
            </ion-card-header>


          <!-- Quantity controls -->
          <div style="display: flex; justify-content: space-between; align-items: center;">


            <!-- Action buttons -->
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div class="quantity-input-container">
                <ion-input type="number" 
                     min="0" 
                     max="9999"
                     [value]="product.quantity || 0"
                     (ionChange)="updateQuantity(product, $event)"
                     style="--padding-start: 8px; --padding-end: 8px; border: 1px solid var(--ion-color-medium); border-radius: 4px; max-width: 60px; text-align: center; background: transparent;">
                </ion-input>
                </div>
              </div>
              
              <div style="display: flex; align-items: center;">
                <ion-button fill="clear" size="small" (click)="adjustQuantity(product, -1)" [disabled]="!product.quantity">
                <ion-icon name="remove-circle" slot="icon-only"></ion-icon>
                </ion-button>
                                
                <ion-button fill="clear" size="small" (click)="adjustQuantity(product, 1)">
                <ion-icon name="add-circle" slot="icon-only" color="success"></ion-icon>
                </ion-button>
              </div>
            </div>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </div>


</ion-content>

<ion-footer *ngIf="cartItems.length > 0">
  <ion-toolbar>
    <ion-title size="small">Total: ₱{{ getCartTotal().toFixed(2) }}</ion-title>
    <ion-buttons slot="end">
      <ion-button expand="block" color="success" (click)="goToCheckout()">
        Checkout ({{ getTotalItems() }} items)
        <ion-icon name="bag-check" slot="end"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-footer>
