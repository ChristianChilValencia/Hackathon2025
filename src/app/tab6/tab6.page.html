<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Customer Shop
    </ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/tabs/tab1">
        <ion-icon name="people"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="ion-padding">
    <ion-row>
      <ion-col size="6" *ngFor="let product of products">
        <ion-card  style="height: 100%; display: flex; flex-direction: column; justify-content: space-between;">
          <ion-card-content>
            <ion-button expand="block" size="small" (click)="showCustomerActionSheet(product)" color="medium">
              More Options
            </ion-button>
            
            <!-- Action buttons -->
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <ion-card-header>{{ product.name }}</ion-card-header>
              <ion-button size="small" 
                    [color]="product.quantity ? 'success' : 'medium'"
                    (click)="product.quantity ? undefined : adjustQuantity(product, 1)" 
                    [disabled]="product.quantity > 0">
              <ion-icon [name]="product.quantity ? 'checkmark-circle' : 'cart'"></ion-icon>
              </ion-button>
            </div>


          <!-- Quantity controls -->
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <div style="font-weight: bold;">₱{{ product.price }}/KG</div>
              
              <div style="display: flex; align-items: center;">
                <ion-button fill="clear" size="small" (click)="adjustQuantity(product, -1)" [disabled]="!product.quantity">
                <ion-icon name="remove-circle" slot="icon-only"></ion-icon>
                </ion-button>
                
                <span>{{ product.quantity || 0 }}</span>
                
                <ion-button fill="clear" size="small" (click)="adjustQuantity(product, 1)">
                <ion-icon name="add-circle" slot="icon-only" color="success"></ion-icon>
                </ion-button>
              </div>
            </div>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </div>

  <ion-footer *ngIf="cartItems.length > 0">
    <ion-toolbar>
      <ion-title size="small">Total: ₱{{ getCartTotal().toFixed(2) }}</ion-title>
      <ion-buttons slot="end">
        <ion-button expand="block" color="success" (click)="goToCheckout()">
          Checkout ({{ getTotalItems() }} items)
          <ion-icon name="bag-check" slot="end"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-footer>
</ion-content>
