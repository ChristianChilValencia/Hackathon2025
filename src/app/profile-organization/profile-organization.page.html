<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>ProfileOrganization</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-item>
    <ion-input type="text" placeholder="First Name"></ion-input>
  </ion-item>
  <ion-item>
    <ion-input type="text" placeholder="Last Name"></ion-input>
  </ion-item>
  <br/>
  <ion-item>
    <ion-input type="text" placeholder="Email"></ion-input>
  </ion-item>
  <ion-item>
  <ion-input type="text" placeholder="Password"></ion-input>
  </ion-item>
  <ion-item>
    <ion-input type="text" placeholder="Phone Number"></ion-input>
  </ion-item>
  <ion-item>
    <ion-input type="text" placeholder="Organization Name"></ion-input>
  </ion-item>
  <ion-item>
    <ion-input type="text" placeholder="Organization Address"></ion-input>
  </ion-item>
  <ion-checkbox labelPlacement="end">I Agree with <a href="privacy">privacy</a> and <a href="policy">policy</a></ion-checkbox>
  <br/>
  <ion-button id="CreateAccount">Create Account</ion-button>
</ion-content>
