<ion-header>
  <ion-toolbar>
    <ion-title>Add Product</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancel()">Cancel</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-label position="stacked">Name</ion-label>
    <ion-input [(ngModel)]="product.name" placeholder="Enter product name"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="stacked">Price</ion-label>
    <ion-input type="number" [(ngModel)]="product.price" placeholder="Enter price"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="stacked">Description</ion-label>
    <ion-textarea [(ngModel)]="product.description" placeholder="Enter description"></ion-textarea>
  </ion-item>

  <ion-button expand="block" (click)="confirm()" class="ion-margin-top">
    Add Product
  </ion-button>
</ion-content>
