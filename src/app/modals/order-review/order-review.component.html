<ion-header>
  <ion-toolbar>
    <ion-title>Order Review</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()">
        <ion-icon name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="ion-padding">
    <ion-list lines="full">
      <ion-list-header>
        <ion-label>Order Items</ion-label>
      </ion-list-header>

      <ion-item *ngFor="let item of cartItems">
        <ion-label>
          <h2>{{ item.name }}</h2>
          <p>Quantity: {{ item.quantity }} x ₱{{ item.price }}</p>
        </ion-label>
        <ion-note slot="end" color="primary">₱{{ (item.price * item.quantity).toFixed(2) }}</ion-note>
      </ion-item>

      <ion-item>
        <ion-label>
          <h2>Total</h2>
        </ion-label>
        <ion-note slot="end" color="success">
          <strong>₱{{ totalCost.toFixed(2) }}</strong>
        </ion-note>
      </ion-item>
    </ion-list>

    <ion-list lines="full">
      <ion-list-header>
        <ion-label>Delivery Details</ion-label>
      </ion-list-header>

      <ion-item>
        <ion-label position="stacked">Delivery Address</ion-label>
        <ion-input [(ngModel)]="deliveryAddress"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Billing Address</ion-label>
        <ion-input [(ngModel)]="billingAddress"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Payment Method</ion-label>
        <ion-select [(ngModel)]="selectedPayment">
          <ion-select-option *ngFor="let method of paymentMethods" [value]="method">
            {{ method }}
          </ion-select-option>
        </ion-select>
      </ion-item>
    </ion-list>
  </div>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-button expand="block" (click)="confirmOrder()" color="success">
      Confirm Order
      <ion-icon name="checkmark" slot="end"></ion-icon>
    </ion-button>
  </ion-toolbar>
</ion-footer>
