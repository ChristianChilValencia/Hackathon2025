<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>AgriVenture</ion-title>
    <ion-buttons slot="end">
      <ion-button>
        <ion-icon name="help-circle-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-buttons slot="start">
      <ion-button>
        <ion-icon name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="profile-avatar">
    <img src="assets/icons/profileimg1.png" alt="Profile Image">
  </div>
  
  <div class="name-row">
    <div class="input-group">
      <div class="label">First Name</div>
      <ion-item>
        <ion-input type="text" value="Pedro" readonly></ion-input>
      </ion-item>
    </div>
    
    <div class="input-group">
      <div class="label">Last Name</div>
      <ion-item>
        <ion-input type="text" value="Penduko" readonly></ion-input>
      </ion-item>
    </div>
  </div>
  
  <div class="input-group">
    <div class="label">Email</div>
    <ion-item>
      <ion-input type="email" value="pedro.penduko@example.com" readonly></ion-input>
    </ion-item>
  </div>
  
  <div class="input-group">
    <div class="label">Password</div>
    <ion-item>
      <ion-input type="password" value="********" readonly></ion-input>
      <ion-icon name="eye-outline" slot="end"></ion-icon>
    </ion-item>
  </div>
  
  <div class="input-group">
    <div class="label">Phone Number</div>
    <ion-item>
      <ion-input type="tel" value="+1234567890" readonly></ion-input>
    </ion-item>
  </div>
  
  <div class="name-row">
    <div class="input-group">
      <div class="label">Date Of Birth</div>
      <ion-item>
        <ion-input value="01/01/1990" readonly></ion-input>
        <ion-icon name="calendar-outline" slot="end"></ion-icon>
      </ion-item>
    </div>
    
    <div class="input-group">
      <div class="label">Gender</div>
      <ion-item>
        <ion-input value="Male" readonly></ion-input>
        <ion-icon name="chevron-down-outline" slot="end"></ion-icon>
      </ion-item>
    </div>
  </div>
  
  <div class="checkbox-container">
    <ion-checkbox>
      <span>I Agree with <a href="privacy">privacy</a> and <a href="policy">policy</a></span>
    </ion-checkbox>
  </div>
  
  <ion-button expand="block" class="create-button">Create Account</ion-button>
</ion-content>
